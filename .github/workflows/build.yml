name: build
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  Ubuntu:
    runs-on: ubuntu-latest
    env:
      MODE: local
      API_PORT: 3000
      SYSTEM_PASSWORD: ci-test-only-placeholder
      # Monitor-only E2E does not connect to PostgreSQL; MyGlobal still validates these keys.
      POSTGRES_URL: postgresql://ci-placeholder:ci-placeholder@127.0.0.1:1/ci-placeholder?schema=public
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 1
      POSTGRES_DATABASE: ci-placeholder
      POSTGRES_SCHEMA: public
      POSTGRES_USERNAME: ci-placeholder
      POSTGRES_USERNAME_READONLY: ci-placeholder
      POSTGRES_PASSWORD: ci-placeholder
    # services:
    #   postgres:
    #     image: postgis/postgis:16-3.4
    #     env:
    #       POSTGRES_PASSWORD: root
    #     ports:
    #       - 5432:5432
    #     options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache ttsc
        uses: actions/cache@v4
        with:
          path: |
            .cache/ttsc/plugins
            .cache/ttsc/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-ttsc-v1-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ttsc-v1-

      - name: Build
        run: pnpm build

      # - name: Create DB Schema
      #   working-directory: packages/backend
      #   run: pnpm schema postgres root

      - name: Test
        working-directory: packages/backend
        run: pnpm test --reset false --simultaneous 16
