name: knittinglog-back-local
services:
  postgres:
    image: postgres:16-alpine
    container_name: knittinglog-back-postgres
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:56543:5432"
    volumes:
      - knittinglog-back-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knittinglog -d knittinglog"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  knittinglog-back-postgres-data:
